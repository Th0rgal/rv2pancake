name: Flapjack integration proofs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Release-report regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Prepare pinned challenge
        run: python3 scripts/prepare-integration.py
      - uses: actions/cache@v4
        with:
          path: .lake/flapjack-integration/.lake
          key: flapjack-${{ runner.os }}-${{ hashFiles('integration/challenge.json', 'FlapjackFlip/*.lean', 'integration/*.lean') }}
          restore-keys: flapjack-${{ runner.os }}-
      - name: Restore dependency proof cache
        working-directory: .lake/flapjack-integration
        run: lake exe cache get
      - name: Frozen specification, proofs, axiom audit, certificate regressions and certified examples
        run: python3 scripts/validate-integration.py proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-proof-evidence
          path: .lake/integration-reports/
